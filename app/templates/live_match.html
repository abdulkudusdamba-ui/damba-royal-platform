<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d2d">
    <meta name="csrf-token" content="{{ csrf }}">
    <title>Live Match | Damba Royal</title>
    <style>
        :root {
            color-scheme: dark;
            --indigo: #100d2d;
            --panel: #1b1742;
            --panel-light: #282259;
            --gold: #d9b66f;
            --gold-light: #f1d899;
            --paper: #f8f4eb;
            --muted: #c2bdd2;
            --line: rgba(241, 216, 153, .24);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--paper);
            font: 16px/1.55 Inter, ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(ellipse at 50% 0, #352b70 0, transparent 46%),
                linear-gradient(150deg, #17133c, var(--indigo) 66%);
        }
        a { color: var(--gold-light); }
        .shell { width: min(1100px, 92%); margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 20px 0; border-bottom: 1px solid var(--line); }
        .brand { color: var(--gold-light); font: 700 17px Georgia, serif; letter-spacing: 2px; }
        .room-label { color: var(--muted); font-size: 12px; }
        main { padding: 34px 0 70px; }
        .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 12px; margin: 0 auto 24px; }
        .competitor, .versus {
            border: 1px solid var(--line);
            border-radius: 15px;
            background: rgba(27, 23, 66, .86);
            padding: 17px 20px;
        }
        .competitor { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .competitor.you { border-color: rgba(241, 216, 153, .75); }
        .competitor span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 1.5px; }
        .competitor strong { display: block; margin-top: 4px; color: var(--gold-light); font: 700 19px Georgia, serif; overflow-wrap: anywhere; }
        .score { color: var(--paper); font-size: 24px; font-weight: 800; }
        .versus { display: grid; place-items: center; color: var(--gold); font: 700 13px Georgia, serif; }
        .chamber {
            position: relative;
            overflow: hidden;
            padding: clamp(22px, 5vw, 46px);
            border: 1px solid rgba(241, 216, 153, .4);
            border-radius: 25px;
            background:
                repeating-linear-gradient(90deg, transparent 0 49px, rgba(241, 216, 153, .04) 50px),
                repeating-linear-gradient(0deg, transparent 0 49px, rgba(241, 216, 153, .04) 50px),
                radial-gradient(ellipse at center, #302765, #18143c 75%);
            box-shadow: 0 30px 75px rgba(0, 0, 0, .32);
        }
        .chamber::before, .chamber::after {
            position: absolute;
            z-index: 0;
            content: "";
            border: 1px solid rgba(241, 216, 153, .13);
            border-radius: 50%;
            pointer-events: none;
        }
        .chamber::before { inset: 7% 10%; }
        .chamber::after { inset: 14% 18%; }
        .chamber-content { position: relative; z-index: 1; max-width: 780px; margin: auto; text-align: center; }
        .kicker { color: var(--gold-light); font-size: 11px; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase; }
        h1, h2 { font-family: Georgia, "Times New Roman", serif; }
        h1 { margin: 9px 0; color: var(--gold-light); font-size: clamp(29px, 5vw, 43px); line-height: 1.12; }
        .description { max-width: 650px; margin: 10px auto; color: var(--muted); }
        .instruction { margin: 17px 0; color: var(--paper); font-weight: 700; }
        .target { min-height: 34px; margin: 16px 0; color: var(--gold-light); font: 700 28px Georgia, serif; letter-spacing: 8px; }
        .clock { width: min(380px, 100%); margin: 20px auto; }
        .clock-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
        .clock-time { color: var(--gold-light); font-size: 18px; font-weight: 800; }
        .track { height: 6px; margin-top: 8px; overflow: hidden; border-radius: 9px; background: rgba(255,255,255,.12); }
        .track span { display: block; width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width .4s linear; }
        .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 24px 0; }
        .option {
            min-height: 90px;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(16, 13, 45, .75);
            color: var(--paper);
            font: 700 14px/1.45 system-ui, sans-serif;
            cursor: pointer;
        }
        .option:hover:not(:disabled), .option.selected { border-color: var(--gold-light); background: rgba(67, 54, 125, .9); }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }
        .option:disabled { cursor: not-allowed; opacity: .68; }
        .submit {
            min-height: 47px;
            padding: 12px 24px;
            border: 1px solid var(--gold-light);
            border-radius: 11px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #201943;
            font: 900 12px system-ui, sans-serif;
            letter-spacing: .8px;
            cursor: pointer;
        }
        .submit:disabled { opacity: .45; cursor: not-allowed; }
        .status { min-height: 25px; margin: 16px 0 0; color: var(--muted); }
        .result { margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 17px; background: rgba(16, 13, 45, .84); }
        .result h2 { margin: 0 0 8px; color: var(--gold-light); }
        .result p { color: var(--muted); }
        .error { color: #ffb9b2; }
        .actions { display: flex; justify-content: center; gap: 18px; margin-top: 24px; }
        [hidden] { display: none !important; }
        @media (max-width: 680px) {
            main { padding-top: 22px; }
            .scoreboard { grid-template-columns: 1fr 1fr; }
            .versus { display: none; }
            .competitor { padding: 13px; }
            .competitor strong { font-size: 16px; }
            .options { grid-template-columns: 1fr; }
            .option { min-height: 60px; }
            .actions { flex-direction: column; align-items: center; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div class="brand">DAMBA ROYAL</div>
            <div class="room-label">LIVE ROOM <strong>{{ room_code }}</strong></div>
            <a href="/dashboard">Exit to dashboard</a>
        </header>
        <main>
            <section class="scoreboard" aria-label="Players and scores">
                <div id="playerOne" class="competitor">
                    <div><span>CHALLENGER</span><strong>Loading…</strong></div><b class="score">—</b>
                </div>
                <div class="versus" aria-hidden="true">VS</div>
                <div id="playerTwo" class="competitor">
                    <div><span>CHALLENGER</span><strong>Loading…</strong></div><b class="score">—</b>
                </div>
            </section>
            <section class="chamber" aria-live="polite">
                <div class="chamber-content">
                    <div class="kicker">Royal live competition</div>
                    <h1 id="challengeTitle">Entering the chamber…</h1>
                    <p id="challengeDescription" class="description"></p>
                    <p id="instruction" class="instruction"></p>
                    <div id="target" class="target"></div>
                    <div id="clock" class="clock" hidden>
                        <div class="clock-row"><span>ROUND DEADLINE</span><span id="clockTime" class="clock-time">—</span></div>
                        <div class="track"><span id="clockProgress"></span></div>
                    </div>
                    <div id="options" class="options"></div>
                    <button id="submitButton" class="submit" type="button" disabled hidden>SUBMIT ANSWER</button>
                    <p id="status" class="status" role="status">Synchronizing both competitors…</p>
                    <div id="result" class="result" hidden>
                        <h2 id="resultHeading">Round complete</h2>
                        <p id="resultText"></p>
                        <p id="correctAnswer"></p>
                        <div class="actions">
                            <a href="/dashboard">Return to dashboard</a>
                            <a href="/live">Enter another competition</a>
                        </div>
                    </div>
                </div>
            </section>
            <p id="error" class="status error" role="alert" aria-live="assertive"></p>
        </main>
    </div>
    <script>
        const roomCode = {{ room_code|tojson }};
        let matchState = null;
        let renderedChallengeId = null;
        let selectedAnswer = null;
        let submitted = false;
        let pollTimer = null;
        let clockTimer = null;
        const errorBox = document.getElementById("error");
        const encodedCode = encodeURIComponent(roomCode);

        async function api(url, options = {}) {
            if (options.method === "POST") {
                options.headers = {
                    ...options.headers,
                    "X-CSRF-Token": document.querySelector('meta[name="csrf-token"]').content
                };
            }
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || "The arena could not be reached.");
            return data;
        }

        function updateScoreboard(players) {
            players.forEach((player, index) => {
                const card = document.getElementById(index === 0 ? "playerOne" : "playerTwo");
                card.classList.toggle("you", player.is_you);
                card.querySelector("span").textContent = player.is_you ? "YOU" : "CHALLENGER";
                card.querySelector("strong").textContent = player.alias;
                card.querySelector(".score").textContent = player.score === null ? "—" : player.score;
            });
        }

        function renderChallenge(challenge) {
            document.getElementById("challengeTitle").textContent = challenge.title;
            document.getElementById("challengeDescription").textContent = challenge.description || "";
            document.getElementById("instruction").textContent = challenge.instruction || "Choose your answer.";
            document.getElementById("target").textContent =
                challenge.target || challenge.display_sequence || challenge.memory_sequence || "";
            const options = document.getElementById("options");
            options.replaceChildren();
            challenge.options.forEach(option => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "option";
                button.textContent = option.label;
                button.disabled = submitted;
                button.setAttribute("aria-pressed", "false");
                button.addEventListener("click", () => {
                    if (submitted) return;
                    selectedAnswer = String(option.id);
                    options.querySelectorAll("button").forEach(item => {
                        item.classList.remove("selected");
                        item.setAttribute("aria-pressed", "false");
                    });
                    button.classList.add("selected");
                    button.setAttribute("aria-pressed", "true");
                    document.getElementById("submitButton").disabled = false;
                });
                options.append(button);
            });
            document.getElementById("submitButton").hidden = false;
            document.getElementById("submitButton").disabled = submitted;
        }

        function renderResult(state) {
            clearInterval(pollTimer);
            clearInterval(clockTimer);
            document.getElementById("clock").hidden = true;
            document.getElementById("options").hidden = true;
            document.getElementById("submitButton").hidden = true;
            document.getElementById("result").hidden = false;
            const result = state.result;
            document.getElementById("resultHeading").textContent =
                result.your_correct ? "Chamber conquered" : "Round complete";
            document.getElementById("resultText").textContent =
                result.your_correct
                    ? `Your answer was correct. You earned ${result.your_score} points.`
                    : `Your score: ${result.your_score}. Your opponent scored ${result.opponent_score}.`;
            const correctOption = state.challenge.options.find(
                option => String(option.id) === String(result.correct_answer)
            );
            document.getElementById("correctAnswer").textContent =
                `Correct answer: ${correctOption ? correctOption.label : result.correct_answer}`;
            updateScoreboard(state.players);
            document.getElementById("status").textContent = "The round has been finalized.";
        }

        function updateClock(seconds) {
            const deadline = matchState.deadline_at ? Date.parse(matchState.deadline_at) : null;
            const remaining = deadline === null
                ? seconds
                : Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
            document.getElementById("clockTime").textContent = `${remaining}s`;
            const total = matchState.challenge.time_limit || 60;
            document.getElementById("clockProgress").style.width =
                `${Math.max(0, Math.min(100, (remaining / total) * 100))}%`;
            if (remaining === 0) document.getElementById("status").textContent = "Deadline reached. Finalizing the round…";
        }

        async function refreshMatch() {
            try {
                const state = await api(`/api/live/rooms/${encodedCode}/match`);
                matchState = state;
                updateScoreboard(state.players);
                if (state.submitted_by_you) submitted = true;
                if (renderedChallengeId !== state.challenge.id) {
                    renderedChallengeId = state.challenge.id;
                    renderChallenge(state.challenge);
                }
                if (state.status === "complete") {
                    renderResult(state);
                    return;
                }
                document.getElementById("clock").hidden = false;
                document.getElementById("status").textContent = state.submitted_by_you
                    ? "Answer submitted. Waiting for the other challenger…"
                    : "Choose an answer before the shared deadline.";
                if (state.submitted_by_you) {
                    submitted = true;
                    document.getElementById("submitButton").disabled = true;
                    document.querySelectorAll(".option").forEach(button => { button.disabled = true; });
                }
                updateClock(state.seconds_remaining);
                if (!clockTimer) clockTimer = setInterval(() => updateClock(state.seconds_remaining), 500);
            } catch (error) {
                errorBox.textContent = error.message;
            }
        }

        document.getElementById("submitButton").addEventListener("click", async () => {
            if (submitted || selectedAnswer === null) return;
            submitted = true;
            document.getElementById("submitButton").disabled = true;
            document.querySelectorAll(".option").forEach(button => { button.disabled = true; });
            try {
                await api(`/api/live/rooms/${encodedCode}/answer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ answer: selectedAnswer })
                });
                await refreshMatch();
            } catch (error) {
                submitted = false;
                errorBox.textContent = error.message;
                await refreshMatch();
            }
        });

        refreshMatch();
        pollTimer = setInterval(refreshMatch, 1000);
    </script>
</body>
</html>
