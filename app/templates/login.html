<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Damba Royal</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="login-container">

        <h1>DAMBA ROYAL</h1>

        <h2>Welcome Back</h2>

        <p>Enter your Royal Email and password to continue your journey.</p>

        <form action="/auth/login" method="post">
            <input type="hidden" name="csrf" value="{{ csrf }}">

            <input
                type="email"
                name="email"
                placeholder="Royal Email"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Enter the Royal Realm
            </button>

        </form>

        <p>
            Don't have a Royal account?
            <a href="/register">Create Account</a>
        </p>

    </div>

    <script src="/static/js/script.js"></script>

</body>
</html>
